# Перевірка на кожен push: тести бекенду, збірка фронтенду, збірка Docker-образу й smoke-тест.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Бекенд (тести)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Залежності
        run: pip install -r backend/requirements.txt pytest httpx
      - name: Тести
        working-directory: backend
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo "Тестів ще немає"; fi
      - name: Імпорт реальних даних UMUNI
        working-directory: backend
        run: python -c "from pathlib import Path; from app.analytics import Store; s=Store(Path('data')); print(s.summary()['buildings'], 'будівель')"

  frontend:
    name: Фронтенд (збірка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

  docker:
    name: Docker (збірка + smoke-тест)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Збірка образу
        run: docker build -t city-insight-energo .
      - name: Запуск і перевірка API
        run: |
          docker run -d --name app -p 8000:8000 city-insight-energo
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/summary > /tmp/summary.json; then break; fi
            sleep 2
          done
          cat /tmp/summary.json | head -c 400; echo
          curl -fsS http://localhost:8000/ | grep -qi "<html" && echo "Фронтенд віддається"
      - name: Логи контейнера
        if: always()
        run: docker logs app || true
